version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3        # PostgreSQL 15 with PostGIS pre-installed
    container_name: spintrail-db
    environment:
      POSTGRES_DB: spintrail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sohan$1977
    ports:
      - "5432:5432"
    volumes:
      - spintrail_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # runs on first startup
    restart: unless-stopped

volumes:
  spintrail_data: